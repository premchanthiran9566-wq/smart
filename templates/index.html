<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MobileMate - Mobile Phone Chatbot</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
        background: #eef1f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .chat-container {
        width: 420px;
        height: 640px;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .chat-header {
        background: #2f5fed;
        color: #ffffff;
        padding: 16px;
        text-align: center;
    }

    .chat-header h1 {
        font-size: 18px;
        font-weight: 600;
    }

    .chat-header p {
        font-size: 12px;
        opacity: 0.85;
        margin-top: 2px;
    }

    .chat-messages {
        flex: 1;
        padding: 14px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .message {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.4;
        white-space: pre-wrap;
    }

    .message.user {
        align-self: flex-end;
        background: #2f5fed;
        color: #ffffff;
        border-bottom-right-radius: 2px;
    }

    .message.bot {
        align-self: flex-start;
        background: #f1f3f8;
        color: #222222;
        border-bottom-left-radius: 2px;
    }

    .message.typing {
        font-style: italic;
        opacity: 0.7;
    }

    .chat-input {
        display: flex;
        border-top: 1px solid #e2e5ea;
        padding: 10px;
        gap: 8px;
    }

    .chat-input input {
        flex: 1;
        border: 1px solid #d6d9df;
        border-radius: 20px;
        padding: 10px 16px;
        font-size: 14px;
        outline: none;
    }

    .chat-input input:focus {
        border-color: #2f5fed;
    }

    .chat-input button {
        background: #2f5fed;
        color: #ffffff;
        border: none;
        border-radius: 20px;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s;
    }

    .chat-input button:hover {
        background: #2549c4;
    }

    .chat-input button:disabled {
        background: #a6b3e8;
        cursor: not-allowed;
    }
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>MobileMate</h1>
        <p>Ask me anything about mobile phones</p>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            Hi! I'm MobileMate. Ask me anything about mobile phones -
            specs, comparisons, buying advice, or troubleshooting.
        </div>
    </div>

    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off">
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById("chatMessages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text, sender) {
        const messageDiv = document.createElement("div");
        messageDiv.classList.add("message", sender);
        messageDiv.textContent = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return messageDiv;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) {
            return;
        }

        addMessage(text, "user");
        userInput.value = "";
        sendBtn.disabled = true;

        const typingDiv = addMessage("MobileMate is typing...", "bot typing");

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();
            typingDiv.remove();
            addMessage(data.reply, "bot");
        } catch (error) {
            typingDiv.remove();
            addMessage("Network error. Please try again.", "bot");
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    sendBtn.addEventListener("click", sendMessage);

    userInput.addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>

</body>
</html>
